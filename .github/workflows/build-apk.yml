name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Generate Version Tag
        id: tag
        run: echo "tag_name=v1.0.$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Dependencies & Build Web Assets
        env:
          VITE_APP_VERSION: ${{ steps.tag.outputs.tag_name }}
        run: |
          npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          USE_CI_KEYSTORE=0
          if [ -n "$KEYSTORE_BASE64" ]; then
            if printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/benchpr.jks"; then
              STORE_PW="${KEYSTORE_PASSWORD:-android}"
              ALIAS="${KEY_ALIAS:-androiddebugkey}"
              if keytool -list -keystore "$RUNNER_TEMP/benchpr.jks" -storepass "$STORE_PW" -alias "$ALIAS" >/dev/null 2>&1; then
                echo "path=$RUNNER_TEMP/benchpr.jks" >> "$GITHUB_OUTPUT"
                echo "store_password=$STORE_PW" >> "$GITHUB_OUTPUT"
                echo "key_alias=$ALIAS" >> "$GITHUB_OUTPUT"
                echo "key_password=${KEY_PASSWORD:-$STORE_PW}" >> "$GITHUB_OUTPUT"
                USE_CI_KEYSTORE=1
                echo "Verified CI signing keystore with alias '$ALIAS'."
              else
                echo "::warning::KEYSTORE_BASE64 is missing matching KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD secrets; falling back to repository debug.keystore."
              fi
            else
              echo "::warning::Failed to decode KEYSTORE_BASE64; falling back to repository debug.keystore."
            fi
          else
            echo "No KEYSTORE_BASE64 secret set; using fallback debug keystore."
          fi

          if [ "$USE_CI_KEYSTORE" -eq 0 ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "store_password=" >> "$GITHUB_OUTPUT"
            echo "key_alias=" >> "$GITHUB_OUTPUT"
            echo "key_password=" >> "$GITHUB_OUTPUT"
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > app/debug.keystore
            else
              # Deterministic Android Debug keystore (CN=Android Debug, pass=android) so in-app updates keep a consistent signature across CI runs.
              cat << 'EOF' | tr -d '[:space:]' | base64 -d > app/debug.keystore

EOF
            fi
          fi

      - name: Build Android Debug APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
          APP_VERSION_NAME: ${{ steps.tag.outputs.tag_name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "PR TRACKER Automated Release ${{ steps.tag.outputs.tag_name }}"
          body: "Automated Android APK build generated on commit ${{ github.sha }}."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
