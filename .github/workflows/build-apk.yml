name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Generate Version Tag
        id: tag
        run: echo "tag_name=v1.0.$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Dependencies & Build Web Assets
        env:
          VITE_APP_VERSION: ${{ steps.tag.outputs.tag_name }}
        run: |
          npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/benchpr.jks"
            echo "path=$RUNNER_TEMP/benchpr.jks" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret set; using fallback debug keystore."
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > app/debug.keystore
            fi
          fi

      - name: Build Android Debug APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.tag.outputs.tag_name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "BenchPR Automated Release ${{ steps.tag.outputs.tag_name }}"
          body: "Automated Android APK build generated on commit ${{ github.sha }}."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
